name: Daily Analysis Update

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas matplotlib mplfinance scipy

    - name: Run analysis scripts
      run: |
        python main.py
        python portfolio_tracker.py
        python structure.py         # <--- 新增這行
        python structure_bottom.py  # <--- 新增這行

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add *.html *.png
        git commit -m "Daily update: $(date +'%Y-%m-%d')" || exit 0
        git push
name: Daily Quant Update

# 設定觸發時機
on:
  schedule:
    # 每天美股收盤後 (例如 UTC 21:30 = 台灣時間 05:30)
    # 這裡設為 UTC 22:00 (台灣早上 6:00) 確保數據已更新
    - cron: '0 22 * * *'
  # 允許手動在 GitHub 網頁上按按鈕觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Main Strategy (Signals & Trades)
      run: python main.py

    - name: Run Portfolio Tracker (Real Account)
      run: python portfolio_tracker.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add index.html trades.html portfolio.html
        # 如果有變動才 Commit，沒變動則略過
        git diff --quiet && git diff --staged --quiet || (git commit -m "📈 Daily Report Update" && git push)
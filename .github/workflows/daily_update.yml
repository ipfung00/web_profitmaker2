name: Daily Analysis Update

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣早上 08:00) 執行
  workflow_dispatch:      # 允許手動點擊按鈕觸發

# 給予 Action 寫入倉庫的權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas matplotlib mplfinance scipy

    - name: Run analysis scripts
      run: |
        python main.py
        python portfolio_tracker.py
        python structure.py
        python structure_bottom.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 👇 [修正] 移除了 *.png，因為我們沒有產生圖片檔
        git add *.html
        git commit -m "Daily update: $(date +'%Y-%m-%d')" || exit 0
        git push